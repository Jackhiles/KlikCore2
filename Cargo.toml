[package]
name = "klikcore"
version = "2.0.15"
edition = "2021"
description = "Clean-room, open-source runtime for Clickteam Fusion 2.5 game data (bring your own game files)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "klikcore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.17"
macroquad = { version = "0.4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memmap2 = "0.9"
serde_json = "1"
# Gamepads (XInput / Windows.Gaming.Input, evdev on Linux) mapped to keyboard + mouse.
# Text for generated library artwork (already used by macroquad).
fontdue = "0.9"
# Steam's cached library artwork (covers in the launcher) is JPEG.
jpeg-decoder = { version = "0.3", default-features = false }
gilrs = "0.11"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "ogg", "vorbis"] }
cpal = "0.15"
# Device pairing and save sync over the local network: key exchange, encryption, hashing.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.9"

[build-dependencies]
# Windows: embeds the .exe icon.
embed-resource = "3"

# Native file dialogs. On Linux (e.g. Steam Deck) the desktop's own picker
# (kdialog / zenity) is used instead, which avoids GTK / Wayland build dependencies.
# Android has no file dialogs (games are found in a folder instead).
# MIDI music outside Windows (Windows uses its own MIDI synthesizer).
[target.'cfg(not(windows))'.dependencies]
rustysynth = "1.3"

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
rfd = "0.15"

# Android (built as a shared library by scripts/android/build.py): cpal's audio backend
# needs the Java VM and activity, which come from miniquad.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"

[profile.dev]
# Decompressing large image banks is painfully slow without optimisation.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
